[project]
name = "openvalley-api"
version = "0.1.0"
description = "Evidence-first Warren property baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.0",
    "pyogrio>=0.13.0",
    "uvicorn>=0.40.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
