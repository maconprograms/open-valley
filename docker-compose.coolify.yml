services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OPENVALLEY_RUNTIME: public
    expose:
      - "8998"
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8998/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        INTERNAL_BASELINE_API_URL: http://api:8998
    environment:
      INTERNAL_BASELINE_API_URL: http://api:8998
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
